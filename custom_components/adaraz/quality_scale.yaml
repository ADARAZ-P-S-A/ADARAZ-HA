# The manifest declares no quality scale until every Bronze rule is done.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register actions.
  appropriate-polling:
    status: exempt
    comment: Push only; devices connect to Home Assistant.
  brands:
    status: todo
    comment: >-
      The custom build ships its images in custom_components/adaraz/brand;
      for the core PR they are submitted to home-assistant/brands instead.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: >-
      The adaraz library (lib/ of this repository, MIT) is published to PyPI
      by the public release workflow .github/workflows/release.yml.
  docs-actions:
    status: exempt
    comment: The integration does not register actions.
  docs-high-level-description:
    status: todo
    comment: >-
      Written in README.md (the documentation link of the custom build); done
      once the integration's page on home-assistant.io exists.
  docs-installation-instructions:
    status: todo
    comment: >-
      Written in README.md (the documentation link of the custom build); done
      once the integration's page on home-assistant.io exists.
  docs-removal-instructions:
    status: todo
    comment: >-
      Written in README.md (the documentation link of the custom build); done
      once the integration's page on home-assistant.io exists.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >-
      Nothing to connect to: the device connects to Home Assistant, and the
      entry is created only after a successful pairing handshake.
  test-before-setup:
    status: exempt
    comment: >-
      The device connects to Home Assistant whenever it can; there is nothing to
      test at setup. Entities are unavailable while it is disconnected.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
    comment: >-
      Written in README.md (card UID option); done once the
      integration's page on home-assistant.io exists.
  docs-installation-parameters:
    status: todo
    comment: >-
      Written in README.md (pairing: URL and code); done once the integration's
      page on home-assistant.io exists.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >-
      There are no credentials to renew. A device paired again (e.g. after a
      factory reset) updates its existing entry through the user flow.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Devices are added by pairing with a code; they connect out.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One device per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All entities are useful by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Nothing to reconfigure; the device stores the URL.
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One device per config entry; removing the entry unpairs it.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The library makes no HTTP requests.
  strict-typing: todo
