name: Home Assistant integration

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "lib/**"
      - "hacs.json"
      - "pyproject.toml"
      - "requirements_test.txt"
      - ".github/workflows/ha.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "lib/**"
      - "hacs.json"
      - "pyproject.toml"
      - "requirements_test.txt"
      - ".github/workflows/ha.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The integration requires the adaraz version in lib/; test against lib/.
          python -m pip install -e ./lib -r requirements_test.txt
      - name: Lint
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Type check
        run: mypy --strict --explicit-package-bases -p custom_components.adaraz
      - name: Tests
        run: >-
          pytest -v
          --cov=custom_components.adaraz --cov-report=term-missing
          --cov-fail-under=95

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
